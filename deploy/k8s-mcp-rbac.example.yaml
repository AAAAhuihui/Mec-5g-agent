# Apply one copy of this Role and RoleBinding in every namespace the Agent may analyze.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k8s-mcp-pod-diagnostics-reader
  namespace: REPLACE_WITH_TARGET_NAMESPACE
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k8s-mcp-pod-diagnostics-reader
  namespace: REPLACE_WITH_TARGET_NAMESPACE
subjects:
  - kind: ServiceAccount
    name: k8s-mcp
    namespace: agent-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: k8s-mcp-pod-diagnostics-reader
